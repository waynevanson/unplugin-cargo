name: publish

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch, or commit SHA to publish
        required: false
        default: main
        type: string

concurrency:
  group: publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@waynevanson"

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./packages/unplugin-cargo/package.json').version")"
          tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match package version $version"
            exit 1
          fi
          if [ -z "$tag" ]; then
            echo "::notice::HEAD is untagged; publishing $version from $(git rev-parse --short HEAD)"
          fi

      - run: pnpm build

      - name: Publish to GitHub Packages
        working-directory: packages/unplugin-cargo
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
