[package]
name = "bruv"
version = "0.1.0"
edition = "2024"

[features]
default = []
multiply = []

[lib]
name = "bro"
crate-type = ['cdylib']

[dependencies]
wasm-bindgen = "=0.2.121"

[workspace]
members = ["."]
resolver = "3"

[profile.jesus]
inherits = "dev"
strip = "debuginfo"

[profile.custom-profile]
inherits = "dev"
opt-level = 1
